<a href="10mb.txt">10mb.txt</a>
<a href="30mb.txt">30mb.txt</a>
<a href="50mb.txt">50mb.txt</a>

<hr>

<div class="code-box">
    <button id="copyBtn">复制命令</button>
    <pre><code id="code"></code></pre>
</div>

<style>
.code-box {
    position: relative;
    background: #0d1117;
    border-radius: 8px;
    overflow: hidden;
}

.code-box pre {
    margin: 0;
    padding: 16px;
    overflow-x: auto;
    color: #c9d1d9;
    font-family: Consolas, Monaco, monospace;
    line-height: 1.5;
}

.code-box button {
    position: absolute;
    top: 10px;
    right: 10px;
    cursor: pointer;
}
</style>

<script>
const str = String.raw`curl --socks5 127.0.0.1:7897 \
  --max-time 8 -o /dev/null -s \
  -w "%{size_download} %{time_namelookup} %{time_connect} %{time_starttransfer} %{time_total} %{speed_download}\n" \
  https://${location.hostname}/50mb.txt | \
awk '{
    mbs=$6/1024/1024;
    mbps=$6*8/1000000;

    if(mbps>=500) grade="★★★★★ 夯爆";
    else if(mbps>=200) grade="★★★★☆ 好用";
    else if(mbps>=50) grade="★★★☆☆ 够用";
    else if(mbps>=10) grade="★★☆☆☆ 能用";
    else if(mbps>=1) grade="★☆☆☆☆ 拉垮";
    else grade="☆☆☆☆☆ 垃圾";

    printf "\n📦 文件大小: %.2f MB\n", $1/1024/1024;
    printf "🌐 DNS解析: %.3fs\n", $2;
    printf "🤝 TCP连接: %.3fs\n", $3;
    printf "📥 首包时间: %.3fs\n", $4;
    printf "⏱️ 总耗时: %.3fs\n", $5;
    printf "🚀 平均速度: %.2f MB/s (%.0f Mbps)\n", mbs, mbps;
    printf "📊 线路评级: %s\n", grade;
}'`;

document.getElementById("code").textContent = str;

document.getElementById("copyBtn").onclick = async () => {
    await navigator.clipboard.writeText(str);
    copyBtn.innerText = "已复制";
    setTimeout(() => copyBtn.innerText = "复制命令", 2000);
};
</script>
