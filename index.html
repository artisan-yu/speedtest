```html
<!DOCTYPE html>
<html>

<head>
     <meta charset="utf-8">
     <title>Speed Test</title>

     <style>
          body {
               max-width: 1000px;
               margin: 20px auto;
               font-family: system-ui;
               padding: 0 20px;
          }

          .files a {
               display: inline-block;
               margin-right: 10px;
               padding: 6px 12px;
               border-radius: 6px;
               background: #f5f5f5;
               text-decoration: none;
          }

          .files a:hover {
               background: #eaeaea;
          }

          .panel {
               margin-top: 20px;
               border: 1px solid #ddd;
               border-radius: 8px;
               padding: 20px;
          }

          button {
               cursor: pointer;
          }

          #startBtn {
               padding: 10px 20px;
               font-size: 15px;
          }

          .progress {
               width: 100%;
               height: 18px;
               background: #eee;
               border-radius: 10px;
               overflow: hidden;
               margin-top: 15px;
          }

          .bar {
               height: 100%;
               width: 0%;
               background: #4caf50;
               transition: width .2s;
          }

          .result {
               margin-top: 15px;
               line-height: 1.8;
               white-space: pre-line;
               font-family: Consolas, Monaco, monospace;
               font-size: 15px;
          }

          .code-box {
               position: relative;
               background: #0d1117;
               border-radius: 8px;
               overflow: hidden;
               margin-top: 15px;
          }

          .code-box pre {
               margin: 0;
               padding: 16px;
               overflow-x: auto;
               color: #c9d1d9;
               font-family: Consolas, Monaco, monospace;
               line-height: 1.5;
          }

          .copy-btn {
               position: absolute;
               right: 10px;
               top: 10px;
          }

          .active-file {
               background: #4caf50 !important;
               color: white;
          }
     </style>
</head>

<body>

     <h2>🚀 Holi Speed Test</h2>

     <div class="files">
          <a href="5mb.txt" data-size="5">5MB</a>
          <a href="10mb.txt" data-size="10">10MB</a>
          <a href="30mb.txt" data-size="30">30MB</a>
          <a href="50mb.txt" data-size="50" class="active-file">50MB</a>
     </div>

     <div class="panel">

          <h3>🌐 浏览器测速</h3>

          <button id="startBtn">
               开始测速
          </button>

          <div class="progress">
               <div class="bar" id="bar"></div>
          </div>

          <div class="result" id="result">
               点击开始测速
          </div>

     </div>

     <div class="panel">

          <h3>🖥 Curl测速</h3>

          <div class="code-box">
               <button class="copy-btn" id="copyBtn">
                    复制命令
               </button>

               <pre><code id="code"></code></pre>
          </div>

     </div>

     <script>

          let currentFile = "50mb.txt";

          const links = document.querySelectorAll(".files a");

          links.forEach(link => {

               link.addEventListener("click", e => {

                    links.forEach(x => x.classList.remove("active-file"));

                    link.classList.add("active-file");

                    currentFile = link.getAttribute("href");

                    updateCurl();

               });

          });

          function buildCurl(file) {

               return String.raw`curl --socks5 127.0.0.1:7897 \
  --max-time 8 \
  -o /dev/null \
  -s \
  -w "%{size_download} %{time_namelookup} %{time_connect} %{time_starttransfer} %{time_total} %{speed_download}\n" \
  https://${location.host}/${file} | \
awk '{
    mbs=$6/1024/1024;
    mbps=$6*8/1000000;

    if(mbps>=500) grade="★★★★★ 夯爆";
    else if(mbps>=200) grade="★★★★☆ 好用";
    else if(mbps>=50) grade="★★★☆☆ 够用";
    else if(mbps>=10) grade="★★☆☆☆ 能用";
    else if(mbps>=1) grade="★☆☆☆☆ 拉垮";
    else grade="☆☆☆☆☆ 垃圾";

     printf "\n📦 文件大小: %.2f MB\n", $1/1024/1024;
    printf "🌐 DNS解析: %.3fs\n", $2;
    printf "🤝 TCP连接: %.3fs\n", $3;
    printf "📥 首包时间: %.3fs\n", $4;
    printf "⏱️ 总耗时: %.3fs\n", $5;
    printf "🚀 平均速度: %.2f MB/s (%.0f Mbps)\n", mbs, mbps;
    printf "📊 线路评级: %s\n", grade;
}'`;

          }

          function updateCurl() {

               const cmd = buildCurl(currentFile);

               document.getElementById("code").textContent = cmd;

               document.getElementById("copyBtn").onclick = async () => {

                    await navigator.clipboard.writeText(cmd);

                    copyBtn.innerText = "已复制";

                    setTimeout(() => {

                         copyBtn.innerText = "复制命令";

                    }, 2000);

               };

          }

          updateCurl();

          function grade(mbps) {

               if (mbps >= 500) return "★★★★★ 夯爆";
               if (mbps >= 200) return "★★★★☆ 好用";
               if (mbps >= 50) return "★★★☆☆ 够用";
               if (mbps >= 10) return "★★☆☆☆ 能用";
               if (mbps >= 1) return "★☆☆☆☆ 拉垮";

               return "☆☆☆☆☆ 垃圾";
          }

          document.getElementById("startBtn").onclick = async () => {

               const btn = document.getElementById("startBtn");

               btn.disabled = true;

               const result = document.getElementById("result");

               const bar = document.getElementById("bar");

               result.innerHTML = "测速中...";

               bar.style.width = "0%";

               const TEST_TIME = 8000;

               const start = performance.now();

               const resp = await fetch(
                    currentFile + "?t=" + Date.now()
               );

               const reader = resp.body.getReader();

               let downloaded = 0;

               while (true) {

                    const { done, value } =
                         await reader.read();

                    if (done)
                         break;

                    downloaded += value.length;

                    const elapsed =
                         performance.now() - start;

                    const progress =
                         Math.min(
                              elapsed / TEST_TIME * 100,
                              100
                         );

                    bar.style.width =
                         progress + "%";


                    const fileSizeMB =
                         downloaded / 1024 / 1024;

                    const speedMBs =
                         fileSizeMB /
                         (elapsed / 1000);

                    const speedMbps =
                         speedMBs * 8;

                    result.innerHTML =
                         `📦 文件大小: ${fileSizeMB.toFixed(2)} MB
⏱️ 总耗时: ${(elapsed / 1000).toFixed(3)}s
🚀 当前速度: ${speedMBs.toFixed(2)} MB/s (${speedMbps.toFixed(0)} Mbps)`;


                    if (elapsed >= TEST_TIME) {

                         reader.cancel();

                         break;
                    }
               }

               const elapsed =
                    (performance.now() - start) / 1000;

               const fileSizeMB =
                    downloaded / 1024 / 1024;

               const speedMBs =
                    fileSizeMB / elapsed;

               const speedMbps =
                    speedMBs * 8;

               result.innerHTML =
                    `📦 文件大小: ${fileSizeMB.toFixed(2)} MB
⏱️ 总耗时: ${elapsed.toFixed(3)}s
🚀 平均速度: ${speedMBs.toFixed(2)} MB/s (${speedMbps.toFixed(0)} Mbps)
📊 线路评级: ${grade(speedMbps)}`;

               bar.style.width = "100%";

               btn.disabled = false;
          };

     </script>

</body>

</html>
```
